services:
  - type: web
    name: navigator-pedagoga-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
    disk:
      name: data
      mountPath: /app/src/data
      sizeGB: 1
